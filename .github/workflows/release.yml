name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.13)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tag must match package.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not a version tag: $TAG" >&2; exit 1 ;;
          esac
          WANT="${TAG#v}"
          ROOT=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./packages/daemon/package.json').version")
          echo "tag=$TAG root=$ROOT daemon=$PKG"
          test "$WANT" = "$ROOT"
          test "$WANT" = "$PKG"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm i --frozen-lockfile
      - run: pnpm test

      - name: npm CLI for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Publish @kevin5251984/guild
        working-directory: packages/daemon
        run: npm publish --access public

      - name: GitHub Release after npm
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
