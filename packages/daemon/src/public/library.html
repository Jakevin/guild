<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild — 技能庫</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/i18n.js"></script>
  </head>
  <body class="app library-page" data-i18n-page="library">
    <aside class="sidebar">
      <div class="side-brand"><a class="logo" href="/">Guild</a></div>
      <nav class="side-nav">
        <a href="/" data-i18n="nav.chat">訊息</a>
        <a href="/studio" data-i18n="nav.studio">酒吧</a>
        <a class="on" href="/library" data-i18n="nav.library">技能庫</a>
        <a href="/subagents" data-i18n="nav.subagents">子代理</a>
        <a href="/settings" data-i18n="nav.settings">模型</a>
      </nav>
      <div class="sidebar-resizer" data-i18n-title="sidebar.resize" title="拖曳調整寬度"></div>
    </aside>
    <section class="pane">
      <header class="pane-head">
        <h1 data-i18n="library.title">技能庫</h1>
        <div class="meta" id="skill-summary"></div>
        <a class="btn" href="/skills/add" data-i18n="library.install">安裝新技能</a>
      </header>
      <div class="page-body">
        <p class="lede" data-i18n-html="library.lede">
          Guild 自己的技能，加上本機 Claude、Codex、Pi、Grok、Cursor 留下的 SKILL.md。
          安裝走 <a href="/skills/add">追加技能</a>；酒吧可以直接勾本機 CLI 技能。
        </p>
        <p id="flash" class="muted"></p>
        <div class="toolbar">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="4.5" stroke="currentColor"/>
              <path d="M10.5 10.5 14 14" stroke="currentColor"/>
            </svg>
            <input id="skill-search" type="search" placeholder="搜尋技能" data-i18n-placeholder="search.skills" />
          </div>
        </div>
        <div id="tag-row" class="chips tag-row"></div>
        <div id="skill-grid" class="skill-grid"></div>
      </div>
    </section>
    <script>
      const flash = document.getElementById("flash");
      const COLORS = ["#7c6af7", "#5b8def", "#2ea887", "#e07a3d", "#d4537e", "#c9a227"];
      let allSkills = [];
      let bots = [];
      let openId = "";
      let activeTags = new Set();
      function tagPills(skill) {
        return (skill.tags || [])
          .map((tag) => {
            const on = activeTags.has(tag) ? " on" : "";
            return (
              '<span class="mini-tag' +
              on +
              '" data-tag="' +
              escapeHtml(tag) +
              '">' +
              escapeHtml(tagLabel(tag)) +
              "</span>"
            );
          })
          .join("");
      }
      function tagCounts() {
        const counts = new Map();
        for (const skill of allSkills) {
          for (const tag of skill.tags || []) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function hue(key) {
        let n = 0;
        for (const ch of key) n = (n + ch.charCodeAt(0) * 13) % COLORS.length;
        return COLORS[n];
      }
      function initials(name) {
        const parts = String(name).trim().split(/[\s-]+/);
        const letters = parts.map((p) => p[0]).join("").slice(0, 2);
        return letters.toUpperCase() || "?";
      }
      function usedBy(skillId) {
        return bots.filter((bot) => (bot.skillIds || []).includes(skillId));
      }
      function cardHtml(skill) {
        const desc = skill.description || "";
        const users = usedBy(skill.id);
        const source =
          skill.source === "host"
            ? skill.hostName || skill.host || t("library.local")
            : skill.source === "catalog"
              ? t("library.catalog")
              : t("library.user");
        const sourceTitle = skill.source === "host" && skill.path ? skill.path : "";
        const who =
          skill.source === "host"
            ? '<span class="muted">' + t("library.host") + "</span>"
            : users.length === 0
              ? '<span class="muted">' + t("library.unused") + "</span>"
              : users
                  .map(
                    (bot) =>
                      '<a href="/edit/' +
                      encodeURIComponent(bot.id) +
                      '">' +
                      escapeHtml(bot.name) +
                      "</a>",
                  )
                  .join("、");
        const open = openId === skill.id;
        return (
          '<article class="lib-card' +
          (open ? " open" : "") +
          '" data-id="' +
          escapeHtml(skill.id) +
          '">' +
          '<div class="skill-ico" style="background:' +
          hue(skill.slug || skill.id) +
          '">' +
          initials(skill.name) +
          "</div>" +
          '<div class="skill-meta"><strong>' +
          escapeHtml(skill.name) +
          '</strong><em class="lib-desc">' +
          escapeHtml(desc) +
          "</em>" +
          (skill.tags && skill.tags.length
            ? '<p class="tag-list">' + tagPills(skill) + "</p>"
            : "") +
          '<p class="used-by">' +
          who +
          "</p>" +
          '<p class="hint"' +
          (sourceTitle ? ' title="' + escapeHtml(sourceTitle) + '"' : "") +
          ">" +
          escapeHtml(source) +
          "</p></div>" +
          (open
            ? '<pre class="lib-body">' + escapeHtml(skill.body || "") + "</pre>"
            : "") +
          "</article>"
        );
      }
      function renderChips() {
        const allOn = activeTags.size === 0;
        document.getElementById("tag-row").innerHTML =
          '<button type="button" class="chip' +
          (allOn ? " on" : "") +
          '" data-tag="">' +
          t("library.all") +
          "</button>" +
          tagCounts()
            .map(([tag, n]) => {
              const on = activeTags.has(tag) ? " on" : "";
              return (
                '<button type="button" class="chip' +
                on +
                '" data-tag="' +
                escapeHtml(tag) +
                '">' +
                escapeHtml(tagLabel(tag)) +
                ' <span class="chip-n">' +
                n +
                "</span></button>"
              );
            })
            .join("");
      }
      function render() {
        renderChips();
        const q = document.getElementById("skill-search").value.toLowerCase();
        const pool = allSkills.filter((skill) => {
          const tags = skill.tags || [];
          const tagOk =
            activeTags.size === 0 || tags.some((tag) => activeTags.has(tag));
          const hay = (
            skill.name +
            " " +
            (skill.description || "") +
            " " +
            (skill.hostName || "") +
            " " +
            (skill.path || "") +
            " " +
            tags.map(tagLabel).join(" ") +
            " " +
            tags.join(" ")
          ).toLowerCase();
          return tagOk && (!q || hay.includes(q));
        });
        const filtering = Boolean(q) || activeTags.size > 0;
        document.getElementById("skill-summary").textContent = filtering
          ? t("library.found", { n: pool.length, total: allSkills.length })
          : t("library.count", { n: allSkills.length });
        const grid = document.getElementById("skill-grid");
        if (pool.length === 0) {
          grid.innerHTML =
            '<section class="empty">' + t("library.emptyHtml") + "</section>";
          return;
        }
        grid.innerHTML = pool.map(cardHtml).join("");
      }

      document.getElementById("skill-search").addEventListener("input", render);
      document.getElementById("tag-row").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-tag]");
        if (!chip) return;
        const tag = chip.getAttribute("data-tag");
        if (!tag || (activeTags.has(tag) && activeTags.size === 1)) {
          activeTags.clear();
        } else {
          activeTags = new Set(tag ? [tag] : []);
        }
        render();
      });
      document.getElementById("skill-grid").addEventListener("click", (event) => {
        const mini = event.target.closest(".mini-tag");
        if (mini) {
          const tag = mini.getAttribute("data-tag");
          activeTags = tag && activeTags.has(tag) && activeTags.size === 1
            ? new Set()
            : new Set(tag ? [tag] : []);
          render();
          return;
        }
        if (event.target.closest("a")) return;
        const card = event.target.closest(".lib-card");
        if (!card) return;
        const id = card.getAttribute("data-id");
        openId = openId === id ? "" : id;
        render();
      });

      Promise.all([
        fetch("/library/skills").then((r) => r.json()),
        fetch("/library/skills/host").then((r) => r.json()).catch(() => []),
        fetch("/bots").then((r) => r.json()),
      ])
        .then(([skills, host, roster]) => {
          const guild = Array.isArray(skills) ? skills : [];
          const local = Array.isArray(host) ? host : [];
          allSkills = guild.concat(local);
          bots = Array.isArray(roster) ? roster : [];
          render();
        })
        .catch((err) => {
          flash.className = "error";
          flash.textContent = err.message;
        });
      window.addEventListener("guild-locale", render);
    </script>
  </body>
</html>
