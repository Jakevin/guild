<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <title>Guild — 模型</title>
    <link rel="stylesheet" href="/style.css?v=aux" />
    <script src="/i18n.js?v=decide"></script>
  </head>
  <body class="app settings-page" data-i18n-page="settings">
    <aside class="sidebar">
      <div class="side-brand"><a class="logo" href="/">Guild</a></div>
      <nav class="side-nav">
        <a href="/" data-i18n="nav.chat">大廳</a>
        <a href="/studio" data-i18n="nav.studio">編制</a>
        <a href="/library" data-i18n="nav.library">工坊</a>
        <a class="on" href="/settings" data-i18n="nav.settings">模型</a>
      </nav>
      <div class="sidebar-resizer" data-i18n-title="sidebar.resize" title="拖曳調整寬度"></div>
    </aside>
    <section class="pane">
      <header class="pane-head">
        <h1 data-i18n="settings.title">模型</h1>
        <div class="locale-switch">
          <button type="button" data-locale="zh-Hant" data-i18n="lang.zh">中</button>
          <button type="button" data-locale="en" data-i18n="lang.en">EN</button>
        </div>
      </header>
      <div class="page-body">
      <p id="flash" class="muted"></p>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <p class="sub" data-i18n="settings.lede">供應商可以是 API key，也可以是登入的訂閱。大廳選一個 provider/model。路由組也是一個模型，額度用完就換下一個。</p>

      <section class="panel">
        <h2 data-i18n="settings.now">現在用的模型</h2>
        <div class="row pick">
          <div>
            <label>provider / model</label>
            <select id="pick"></select>
          </div>
          <button type="button" id="apply" data-i18n="settings.apply">套用</button>
        </div>
        <p class="sub" id="picker-hint" hidden></p>
        <p class="main-now" id="main-now"></p>
        <div class="toggles">
          <span id="reasoning-wrap">
            <span data-i18n="reasoning">推理強度</span>
            <select id="reasoning"></select>
          </span>
          <label><input type="checkbox" id="fast" /> Fast</label>
        </div>
      </section>

      <details class="aux-fold">
        <summary data-i18n="settings.aux">輔助模型</summary>
        <div class="panel-head">
          <p class="sub" data-i18n="settings.auxHint">只有 Vision、Web extract、SubAgent、Classifier 可以另選模型。其餘用途一律跟主模型。</p>
          <button type="button" class="linkish" id="reset-aux" data-i18n="settings.auxReset">全部改回主模型</button>
        </div>
        <div id="aux"></div>
      </details>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 data-i18n="settings.providers">供應商</h2>
            <p class="sub" data-i18n="settings.providersHint">點一列展開。訂閱按連接，API key 貼上金鑰。路由組也是一列。</p>
          </div>
          <div>
            <button type="button" class="linkish" id="add-decide" data-i18n="settings.decide" data-i18n-title="settings.decideHint" title="核對這一輪有沒有做完，以及要不要再推一把。沒選就跟主模型。">決策模型</button>
            <button type="button" class="linkish" id="add-group" data-i18n="settings.addGroup">路由組</button>
            <button type="button" class="linkish" id="add-provider-open" data-add-provider="1" data-i18n="settings.addChip">＋ 新增</button>
          </div>
        </div>
        <p class="sub" id="decide-now"></p>
        <div id="roster"></div>
        <div id="accounts"></div>
        <div id="oauth-panel" hidden>
          <p id="oauth-copy" data-i18n="settings.oauthCode">在瀏覽器開啟授權頁，輸入代碼：</p>
          <p class="codebox" id="user-code"></p>
          <p><a id="verify-link" target="_blank" rel="noreferrer" data-i18n="settings.openAuth">開啟授權頁</a></p>
          <div id="paste-wrap" hidden>
            <label data-i18n="settings.pasteHint">若瀏覽器在別台機器，貼上導向網址或 code</label>
            <input id="paste-code" placeholder="http://localhost:…/?code= 或授權碼" />
            <button type="button" id="paste-go" data-i18n="settings.finishLogin">完成登入</button>
          </div>
        </div>
        <div id="providers"></div>
        <div id="groups"></div>
      </section>
      </div>
    </section>
    <dialog class="pick" id="aux-dialog">
      <h2 id="aux-title">更改輔助模型</h2>
      <label data-i18n="settings.provider">供應商</label>
      <select id="aux-provider"></select>
      <label data-i18n="model">模型</label>
      <select id="aux-model"></select>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="aux-cancel" data-i18n="cancel">取消</button>
        <button type="button" id="aux-save" data-i18n="settings.apply">套用</button>
      </div>
    </dialog>
    <dialog class="pick add-provider" id="add-provider-dialog">
      <h2 data-i18n="settings.addProvider">新增供應商</h2>
      <p class="sub" data-i18n="settings.pickTemplate">選一家模板，會帶好 endpoint 與環境變數名稱。</p>
      <div class="preset-grid" id="preset-grid"></div>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="add-provider-cancel" data-i18n="cancel">取消</button>
      </div>
    </dialog>
    <script>
      let data = {
        default: null,
        reasoning: "medium",
        fast: false,
        aux: {},
        auxRoles: [],
        providers: [],
        subscriptions: [],
        webBridges: [],
        picker: [],
        recent: [],
        groups: {},
        freeScan: null,
        active: null,
      };
      let pendingOauth = null;
      let pendingWeb = null;
      let auxRole = null;
      let keyTab = 0;
      let subTab = "";
      let openKind = "";
      let openGroup = "";
      const PRESETS = {
        "opencode-free": {
          id: "opencode-free",
          name: "OpenCode Free",
          baseUrl: "https://opencode.ai/zen/v1",
          api: "openai-completions",
          apiKey: "",
          models: [
            { id: "muse-spark-1.2-contributor-free", name: "Muse Spark 1.2 Contributor Free" },
            { id: "laguna-s-2.1-free", name: "Laguna S 2.1 Free" },
            { id: "mimo-v2.5-free", name: "Mimo V2.5 Free" },
          ],
        },
        openai: {
          id: "openai",
          name: "OpenAI",
          baseUrl: "https://api.openai.com/v1",
          api: "openai-completions",
          apiKey: "$OPENAI_API_KEY",
          models: [{ id: "gpt-4.1-mini", name: "GPT-4.1 mini" }, { id: "gpt-4.1", name: "GPT-4.1" }],
        },
        anthropic: {
          id: "anthropic",
          name: "Anthropic",
          baseUrl: "https://api.anthropic.com",
          api: "anthropic-messages",
          apiKey: "$ANTHROPIC_API_KEY",
          models: [{ id: "claude-sonnet-4-5", name: "Claude Sonnet 4.5" }],
        },
        xai: {
          id: "xai",
          name: "xAI",
          baseUrl: "https://api.x.ai/v1",
          api: "openai-completions",
          apiKey: "$XAI_API_KEY",
          models: [{ id: "grok-4.6", name: "Grok 4.6" }, { id: "grok-4-fast", name: "Grok 4 Fast" }],
        },
        openrouter: {
          id: "openrouter",
          name: "OpenRouter",
          baseUrl: "https://openrouter.ai/api/v1",
          api: "openai-completions",
          apiKey: "$OPENROUTER_API_KEY",
          models: [{ id: "anthropic/claude-sonnet-4", name: "Claude Sonnet 4" }],
        },
        ollama: {
          id: "ollama",
          name: "Ollama",
          baseUrl: "http://localhost:11434/v1",
          api: "openai-completions",
          apiKey: "ollama",
          models: [{ id: "llama3.1:8b", name: "Llama 3.1 8B" }],
        },
        google: {
          id: "google",
          name: "Google AI Studio",
          baseUrl: "https://generativelanguage.googleapis.com/v1beta/openai",
          api: "openai-completions",
          apiKey: "$GEMINI_API_KEY",
          models: [{ id: "gemini-2.5-flash", name: "Gemini 2.5 Flash" }],
        },
        groq: {
          id: "groq",
          name: "Groq",
          baseUrl: "https://api.groq.com/openai/v1",
          api: "openai-completions",
          apiKey: "$GROQ_API_KEY",
          models: [{ id: "llama-3.3-70b-versatile", name: "Llama 3.3 70B" }],
        },
        deepseek: {
          id: "deepseek",
          name: "DeepSeek",
          baseUrl: "https://api.deepseek.com/v1",
          api: "openai-completions",
          apiKey: "$DEEPSEEK_API_KEY",
          models: [{ id: "deepseek-chat", name: "DeepSeek Chat" }],
        },
        custom: {
          id: "custom",
          name: "Custom",
          baseUrl: "https://api.example.com/v1",
          api: "openai-completions",
          apiKey: "",
          models: [{ id: "my-model", name: "" }],
        },
      };

      let toastTimer = 0;
      function showToast(text) {
        const el = document.getElementById("toast");
        if (!el || !text) return;
        el.textContent = text;
        el.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("on"), 2200);
      }
      function flash(kind, text) {
        const el = document.getElementById("flash");
        if (kind === "health" || kind === "ok") {
          el.className = "muted";
          el.textContent = "";
          showToast(text);
          return;
        }
        el.className = kind;
        el.textContent = text;
      }
      function webBridgeError(code) {
        if (!code) return "";
        const key = "error." + String(code);
        const msg = t(key);
        return msg !== key ? msg : String(code);
      }
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function pickerGroups() {
        return data.picker || [];
      }
      function pickerLabel(p) {
        if (p && p.kind === "web-bridge" && p.id === "freebuff-chat") {
          return t("settings.freebuffChat");
        }
        if (p && p.kind === "commandcode") return t("settings.commandCode");
        if (p && p.kind === "antigravity") return t("settings.antigravity");
        return (p && p.name) || (p && p.id) || "";
      }
      function fillSelect(sel, groups, preferred) {
        sel.innerHTML = groups
          .map((p) => {
            const mark = p.ready ? "" : t("settings.notLoggedIn");
            return (
              '<option value="' +
              escapeHtml(p.id) +
              '"' +
              (p.ready ? "" : " data-locked=1") +
              ">" +
              escapeHtml(pickerLabel(p) + mark) +
              "</option>"
            );
          })
          .join("");
        const pid = (preferred && preferred.provider) || groups.find((p) => p.ready)?.id || groups[0]?.id || "";
        if (pid) sel.value = pid;
        fillModels(sel, document.getElementById(sel.id === "provider" ? "model" : "aux-model"), preferred);
        updatePickerHint(sel);
      }
      function fillModels(psel, msel, preferred) {
        const group = pickerGroups().find((p) => p.id === psel.value);
        msel.innerHTML = ((group && group.models) || [])
          .map(
            (m) =>
              '<option value="' +
              escapeHtml(m.id) +
              '">' +
              escapeHtml(prettyModelName(m.id, m.name)) +
              "</option>",
          )
          .join("");
        if (preferred && preferred.provider === psel.value) msel.value = preferred.model;
        if (psel.id === "provider") fillReasoning();
        updatePickerHint(psel);
      }
      function updatePickerHint(psel) {
        if (psel && psel.id && psel.id !== "pick") return;
        const hint = document.getElementById("picker-hint");
        if (!hint) return;
        const ref = currentRef();
        const group = pickerGroups().find((p) => p.id === (ref && ref.provider));
        if (group && group.kind === "web-bridge") {
          hint.hidden = false;
          hint.textContent = t("settings.freebuffChatHint");
        } else if (group && group.kind === "commandcode") {
          hint.hidden = false;
          hint.textContent = t("settings.commandCodeHint");
        } else if (group && group.kind === "antigravity") {
          hint.hidden = false;
          hint.textContent = t("settings.antigravityHint");
        } else if (group && group.kind === "group") {
          hint.hidden = false;
          hint.textContent = t("settings.groupsHint");
        } else if (group && group.id === "free") {
          hint.hidden = false;
          hint.textContent = freeHintText();
        } else {
          hint.hidden = true;
          hint.textContent = "";
        }
      }
      function reasonLabel(value) {
        if (value === "none") return t("reason.none");
        if (value === "minimal") return t("reason.min");
        if (value === "low") return t("reason.low");
        if (value === "medium") return t("reason.mid");
        if (value === "high") return t("reason.high");
        if (value === "xhigh") return t("reason.xhigh");
        if (value === "max") return t("reason.max");
        return value || "";
      }
      function fillReasoning() {
        const sel = document.getElementById("reasoning");
        const wrap = document.getElementById("reasoning-wrap");
        const ref = currentRef();
        const group = pickerGroups().find((p) => p.id === (ref && ref.provider));
        const model = ((group && group.models) || []).find(
          (m) => m.id === (ref && ref.model),
        );
        const spec =
          group && (group.kind === "commandcode" || group.kind === "antigravity")
            ? null
            : (model && model.reasoning) || null;
        const raw = spec && spec.supportedEfforts;
        const choices = raw && raw.length
          ? spec.mandatory
            ? raw.filter((key) => key !== "none")
            : raw.slice()
          : [];
        sel.innerHTML = choices
          .map(
            (value) =>
              '<option value="' +
              escapeHtml(value) +
              '">' +
              escapeHtml(reasonLabel(value)) +
              "</option>",
          )
          .join("");
        const want = data.reasoning;
        if (want && choices.indexOf(want) >= 0) sel.value = want;
        else if (spec && spec.defaultEffort && choices.indexOf(spec.defaultEffort) >= 0) {
          sel.value = spec.defaultEffort;
        } else if (choices.indexOf("medium") >= 0) sel.value = "medium";
        else if (choices.indexOf("high") >= 0) sel.value = "high";
        else if (choices.indexOf("low") >= 0) sel.value = "low";
        else if (choices.length) sel.value = choices[0];
        if (wrap) wrap.hidden = !choices.length;
      }
      function currentRef() {
        const sel = document.getElementById("pick");
        if (!sel) return null;
        const parts = String(sel.value || "").split("\u001f");
        if (!parts[0] || !parts[1]) return null;
        return { provider: parts[0], model: parts[1] };
      }
      function fillPick() {
        const sel = document.getElementById("pick");
        if (!sel) return;
        const current = data.default;
        sel.innerHTML = pickerGroups()
          .map((p) => {
            const models = p.models || [];
            if (!models.length) {
              return (
                '<option value="' +
                escapeHtml(p.id) +
                '\u001f" disabled>' +
                escapeHtml(pickerLabel(p) + t("settings.notLoggedIn")) +
                "</option>"
              );
            }
            return models
              .map((m) => {
                const on = current && current.provider === p.id && current.model === m.id;
                const name = prettyModelName(m.id, m.name);
                const label = p.id === "free" ? name : pickerLabel(p) + " / " + name;
                return (
                  '<option value="' +
                  escapeHtml(p.id + "\u001f" + m.id) +
                  '"' +
                  (on ? " selected" : "") +
                  ">" +
                  escapeHtml(label) +
                  (p.ready ? "" : escapeHtml(t("settings.notLoggedIn"))) +
                  "</option>"
                );
              })
              .join("");
          })
          .join("");
        fillReasoning();
        updatePickerHint();
      }
      function groupReady(id) {
        return Boolean((data.picker || []).find((p) => p.id === id && p.ready));
      }
      function prettyModelName(id, given) {
        const raw = String(id || "");
        const label = String(given || "").trim();
        if (label && label !== raw) return label;
        const core = (raw.split("/").pop() || raw).trim();
        const spaced = core
          .replace(/[:_]+/g, "-")
          .replace(/([A-Za-z])(\d)/g, "$1 $2")
          .replace(/-/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        if (!spaced) return raw;
        return spaced.replace(/\b([a-z])/g, function (ch) {
          return ch.toUpperCase();
        });
      }
      function modelLabel(ref) {
        if (!ref || !ref.provider || !ref.model) return t("settings.noDefault");
        const group = pickerGroups().find((p) => p.id === ref.provider);
        const hit = ((group && group.models) || []).find((m) => m.id === ref.model);
        const name = prettyModelName(ref.model, hit && hit.name);
        const vendor = pickerLabel(group) || ref.provider;
        return name + " · " + vendor;
      }
      function modelWire(ref) {
        if (!ref || !ref.provider || !ref.model) return "";
        return ref.provider + " / " + ref.model;
      }
      function effectiveAux(roleId) {
        const own = (data.aux || {})[roleId];
        if (own && own.provider && own.model) {
          return { ref: own, inherited: false };
        }
        return { ref: data.default, inherited: true };
      }
      function uniqueId(base) {
        const used = new Set((data.providers || []).map((p) => p.id));
        if (!used.has(base)) return base;
        let n = 2;
        while (used.has(base + "-" + n)) n += 1;
        return base + "-" + n;
      }
      function accountCard(s, kind) {
        const badge = s.connected || s.ready
          ? '<span class="badge">' + t("settings.connected") + "</span>"
          : s.pending
            ? '<span class="badge wait">' + t("settings.pending") + "</span>"
            : "";
        const id = escapeHtml(s.id);
        let actions;
        if (kind === "commandcode") {
          const paste = s.connected || s.ready
            ? ""
            : '<input type="text" data-cc-key spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="user_… / $COMMAND_CODE_API_KEY" />' +
              '<button type="button" class="secondary" data-cc-save>' + t("settings.saveKey") + "</button>";
          const sync =
            '<button type="button" class="secondary" data-cc-sync>' + t("settings.sync") + "</button>";
          actions = (s.connected || s.ready
            ? '<button type="button" class="secondary" data-cc-logout="' + id + '">' + t("settings.logout") + "</button>"
            : '<button type="button" data-cc-login="' + id + '">' + t("settings.connect") + "</button>") + paste + sync;
        } else if (kind === "antigravity") {
          actions =
            '<button type="button" class="secondary" data-agy-sync>' +
            t("settings.sync") +
            "</button>";
        } else if (kind === "web-bridge") {
          const doctor =
            '<button type="button" class="secondary" data-web-doctor="' +
            id +
            '">' +
            t("settings.doctor") +
            "</button>";
          actions = s.connected || s.ready
            ? '<button type="button" class="secondary" data-web-logout="' +
              id +
              '">' +
              t("settings.logout") +
              "</button>" +
              doctor
            : '<button type="button" data-web-login="' +
              id +
              '">' +
              t("settings.connect") +
              "</button>" +
              doctor;
        } else {
          actions = s.connected || s.ready
            ? '<button type="button" class="secondary" data-logout="' + s.id + '">' + t("settings.logout") + "</button>"
            : '<button type="button" data-login="' + s.id + '">' + t("settings.connect") + "</button>";
        }
        const title = kind === "web-bridge" ? t("settings.freebuffChat") : kind === "commandcode" ? t("settings.commandCode") : kind === "antigravity" ? t("settings.antigravity") : s.name;
        const hint = kind === "web-bridge" ? t("settings.freebuffChatHint") : kind === "commandcode" ? t("settings.commandCodeHint") : kind === "antigravity" ? t("settings.antigravityHint") : (s.hint || "");
        const loginHint = kind === "web-bridge" ? t("settings.freebuffLoginHint") : kind === "commandcode" ? t("settings.commandCodeLoginHint") : kind === "antigravity" ? t("settings.antigravityLoginHint") : (s.loginHint || "");
        const row =
          '<div class="account"><div class="account-copy"><strong>' +
          escapeHtml(title) +
          badge +
          "</strong><span class='sub'>" +
          escapeHtml(hint) +
          (s.importHint ? " · " + escapeHtml(s.importHint) : "") +
          "</span>" +
          (loginHint ? '<p class="warn">' + escapeHtml(loginHint) + "</p>" : "") +
          "</div><div class='account-act'>" +
          actions +
          "</div></div>";
        return '<div class="account-block">' + row + accountModelsHtml(s, kind) + "</div>";
      }
      function accountList() {
        return (data.subscriptions || [])
          .map((s) => ({ s: s, kind: "oauth" }))
          .concat(data.commandCode ? [{ s: data.commandCode, kind: "commandcode" }] : [])
          .concat(data.antigravity ? [{ s: data.antigravity, kind: "antigravity" }] : [])
          .concat((data.webBridges || []).map((s) => ({ s: s, kind: "web-bridge" })));
      }
      function accountTabId(item) {
        if (!item) return "";
        if (item.kind === "commandcode") return "commandcode";
        if (item.kind === "antigravity") return "antigravity";
        return item.s.pickerId || item.s.id || "";
      }
      function accountTabTitle(item) {
        if (item.kind === "web-bridge") return t("settings.freebuffChat");
        if (item.kind === "commandcode") return t("settings.commandCode");
        if (item.kind === "antigravity") return t("settings.antigravity");
        return item.s.name || item.s.id || "";
      }
      function accountTabBadge(item) {
        if (item.s.connected || item.s.ready) {
          return '<span class="badge">' + t("settings.connected") + "</span>";
        }
        if (item.s.pending) {
          return '<span class="badge wait">' + t("settings.pending") + "</span>";
        }
        return "";
      }
      function accountModelsHtml(s, kind) {
        const catalog = s.catalog || s.models || [];
        if (!(s.connected || s.ready) || !catalog.length) return "";
        const provider = kind === "commandcode" ? "commandcode" : kind === "antigravity" ? "antigravity" : s.pickerId || s.id;
        const shown = s.shownIds;
        const modelOn = (m) => !shown || shown.indexOf(m.id) >= 0;
        const allOn = !shown || catalog.every(modelOn);
        const nOn = catalog.filter(modelOn).length;
        const ordered = catalog.slice().sort((a, b) => (modelOn(a) ? 0 : 1) - (modelOn(b) ? 0 : 1));
        const bar =

      function orderShownRows(box) {
        const rows = Array.from(box.querySelectorAll(".account-model"));
        rows.sort((a, b) => {
          const aBox = a.querySelector("[data-shown]");
          const bBox = b.querySelector("[data-shown]");
          const aOn = aBox && aBox.checked ? 0 : 1;
          const bOn = bBox && bBox.checked ? 0 : 1;
          if (aOn !== bOn) return aOn - bOn;
          return Number((aBox && aBox.getAttribute("data-shown-i")) || 0) -
            Number((bBox && bBox.getAttribute("data-shown-i")) || 0);
        });
        rows.forEach((row) => {
          const on = Boolean(row.querySelector("[data-shown]") && row.querySelector("[data-shown]").checked);
          row.classList.toggle("is-on", on);
          box.appendChild(row);
        });
      }
      function syncShownBar(box) {
        const boxes = Array.from(box.querySelectorAll("[data-shown]"));
        const head = box.querySelector("[data-shown-all]");
        const n = boxes.filter((el) => el.checked).length;
        if (head) {
          head.checked = boxes.length > 0 && n === boxes.length;
          head.indeterminate = n > 0 && n < boxes.length;
        }
        const count = box.querySelector(".account-models-count");
        if (count) count.textContent = n + " / " + boxes.length;
        orderShownRows(box);
      }
      async function saveShown(box) {
        const id = box.getAttribute("data-shown-box");
        if (!id) return;
        const boxes = Array.from(box.querySelectorAll("[data-shown]"));
        const checked = boxes.filter((el) => el.checked).map((el) => el.getAttribute("data-shown")).filter(Boolean);
        const shownIds = checked.length === boxes.length ? null : checked;
        const res = await fetch("/settings/shown", {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: id, shownIds: shownIds }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          flash("error", body.error || "save failed");
          await load();
          return;
        }
        data = body;
      }
      let shownSave = Promise.resolve();
      function queueShown(box) {
        shownSave = shownSave.then(() => saveShown(box), () => saveShown(box));
        return shownSave;
      }
      let pendingCc = null;
      async function pollCc() {
        if (!pendingCc) return;
        const res = await fetch("/settings/commandcode/poll", { method: "POST" });
        const body = await res.json();
        if (body.ready || body.connected) {
          pendingCc = null;
          document.getElementById("oauth-panel").hidden = true;
          flash("health", t("settings.connectedId", { id: "commandcode" }));
          await load();
          return;
        }
        if (body.error) {
          pendingCc = null;
          flash("error", body.error);
          await load();
          return;
        }
        setTimeout(pollCc, 1200);
      }
      document.getElementById("accounts").addEventListener("change", async (event) => {
        const box = event.target.closest("[data-shown-box]");
        if (!box) return;
        const all = event.target.closest("[data-shown-all]");
        if (all) {
          const on = event.target.checked;
          box.querySelectorAll("[data-shown]").forEach((el) => {
            el.checked = on;
          });
        }
        syncShownBar(box);
        await queueShown(box);
      });
      document.getElementById("accounts").addEventListener("click", async (event) => {

            if (!res.ok) { flash("error", body.error || t("settings.syncFailed")); return; }
            data = body;
            render();
            flash("health", t("settings.synced", { n: body.synced || 0 }));
          } finally {
            agySync.disabled = false;
          }
          return;
        }
        if (ccSync) {
          ccSync.disabled = true;
          flash("", t("settings.syncing"));
          try {
            const res = await fetch("/settings/commandcode/sync", { method: "POST" });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) { flash("error", body.error || t("settings.syncFailed")); return; }
            data = body;
            render();
            flash("health", t("settings.synced", { n: body.synced || 0 }));
          } finally {
            ccSync.disabled = false;
          }
          return;
        }
        if (ccLogin) {
          const res = await fetch("/settings/commandcode/login", { method: "POST" });
          const body = await res.json();
          if (!res.ok) { flash("error", body.error || "login failed"); return; }
          if (body.loginUrl) {
            window.open(body.loginUrl, "_blank", "noopener");
            showOauthPanel({ verificationUri: body.loginUrl, flow: "pkce" });
          }
          pendingCc = "commandcode";
          flash("muted", t("settings.commandCodeLoginOpened"));
          pollCc();
          return;
        }
        if (ccLogout) {
          await fetch("/settings/commandcode/logout", { method: "POST" });
          pendingCc = null;
          await load();
          return;
        }
        if (ccSave) {
          const input = event.target.closest(".account").querySelector("[data-cc-key]");
          const apiKey = input && input.value;
          const res = await fetch("/settings/commandcode/key", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ apiKey: apiKey || "" }),
          });
          const body = await res.json();
          if (!res.ok) { flash("error", body.error || "key failed"); return; }
          flash("health", t("settings.connectedId", { id: "commandcode" }));
          await load();
          return;
        }
        const webLogin = event.target.closest("[data-web-login]");
        const webLogout = event.target.closest("[data-web-logout]");
        const webDoctor = event.target.closest("[data-web-doctor]");
        if (webLogin) {
          const id = webLogin.getAttribute("data-web-login");
          const res = await fetch("/settings/web/" + id + "/login", { method: "POST" });
          const body = await res.json();
          if (res.status === 409) { flash("error", webBridgeError(body.error) || t("error.freebuff_busy")); return; }
          if (!res.ok) { flash("error", webBridgeError(body.error) || body.error || "login failed"); return; }
          if (body.error) { flash("error", webBridgeError(body.error) || body.error); return; }
          if (body.connected || body.ready) {
            pendingWeb = null;
            document.getElementById("oauth-panel").hidden = true;
            flash("health", t("settings.connectedId", { id: id }));
            await load();
            return;
          }
          if (body.loginUrl) {
            window.open(body.loginUrl, "_blank", "noopener");
            showOauthPanel({ verificationUri: body.loginUrl, flow: "device" });
          }
          pendingWeb = id;
          flash("muted", t("settings.webLoginOpened"));
          pollWeb(id);
          return;
        }
        if (webLogout) {
          await fetch("/settings/web/" + webLogout.getAttribute("data-web-logout") + "/logout", { method: "POST" });
          pendingWeb = null;
          await load();
          return;
        }
        if (webDoctor) {
          const id = webDoctor.getAttribute("data-web-doctor");
          const res = await fetch("/settings/web/" + id + "/doctor", { method: "POST" });
          const body = await res.json();
          if (res.status === 409) { flash("error", webBridgeError(body.error) || t("error.freebuff_busy")); return; }
          if (!res.ok) { flash("error", webBridgeError(body.error) || body.error || "doctor failed"); return; }
          const failed = (body.failed || []).join(", ");
          if (body.ok) flash("health", t("settings.probeOk"));
          else flash("error", failed ? t("settings.freebuffDoctorFail", { names: failed }) : (webBridgeError(body.code || body.error) || t("settings.probeFail")));
          await load();
          return;
        }
        const login = event.target.closest("[data-login]");
        const logout = event.target.closest("[data-logout]");
        if (login) {
          const id = login.getAttribute("data-login");
          const res = await fetch("/settings/oauth/" + id + "/login", { method: "POST" });
          const body = await res.json();
          if (!res.ok) { flash("error", body.error || "login failed"); return; }
          pendingOauth = id;
          showOauthPanel(body);
          flash("muted", t("settings.waitingAuth"));
          poll(id);
        }
        if (logout) {
          await fetch("/settings/oauth/" + logout.getAttribute("data-logout") + "/logout", { method: "POST" });
          await load();
        }
      });
      function showOauthPanel(body) {
        const panel = document.getElementById("oauth-panel");
        panel.hidden = false;
        const code = body.userCode || "";
        document.getElementById("user-code").textContent = code;
        document.getElementById("user-code").hidden = !code;
        document.getElementById("oauth-copy").textContent = code
          ? t("settings.oauthCode")
          : t("settings.oauthBrowser");
        const link = document.getElementById("verify-link");
        link.href = body.verificationUri || "#";
        const paste = document.getElementById("paste-wrap");
        paste.hidden = body.flow !== "pkce";
        document.getElementById("paste-code").value = "";
      }
      async function poll(id) {
        const res = await fetch("/settings/oauth/" + id + "/poll", { method: "POST" });
        const body = await res.json();
        if (body.connected || body.ready) {
          document.getElementById("oauth-panel").hidden = true;
          flash("health", t("settings.connectedId", { id: id }));
          await load();
          return;
        }
        if (body.error) {
          flash("error", body.error);
          return;
        }
        if (body.pending) setTimeout(() => poll(id), 3000);
      }
      async function pollWeb(id) {
        if (pendingWeb !== id) return;
        const res = await fetch("/settings/web/" + id + "/poll", { method: "POST" });
        const body = await res.json();
        if (!res.ok) {
          flash("error", webBridgeError(body.error) || body.error || "poll failed");
          return;
        }
        if (body.connected || body.ready) {
          pendingWeb = null;
          document.getElementById("oauth-panel").hidden = true;
          flash("health", t("settings.connectedId", { id: id }));
          await load();
          return;
        }
        if (body.error && body.error !== "freebuff_busy") {
          if (
            (body.pending || pendingWeb === id) &&
            (body.error === "freebuff_login_required" || body.error === "freebuff_ui_drift")
          ) {
            setTimeout(() => pollWeb(id), 3000);
            return;
          }
          flash("error", webBridgeError(body.error) || body.error);
          return;
        }
        if (body.pending || pendingWeb === id) setTimeout(() => pollWeb(id), 3000);
      }
      document.getElementById("paste-go").addEventListener("click", async () => {
        if (!pendingOauth) return;
        const res = await fetch("/settings/oauth/" + pendingOauth + "/complete", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("paste-code").value }),
        });
        const body = await res.json();
        if (!res.ok) { flash("error", body.error || "complete failed"); return; }
        document.getElementById("oauth-panel").hidden = true;
        flash("health", t("settings.connectedId", { id: pendingOauth }));
        await load();
      });
      document.getElementById("add-provider-open").addEventListener("click", () => {
        renderPresetGrid();
        document.getElementById("add-provider-dialog").showModal();
      });
      document.getElementById("roster").addEventListener("click", (event) => {
        const target = event.target.closest ? event.target : event.target.parentElement;
        if (!target || !target.closest) return;
        const sub = target.closest("[data-sub-tab]");
        const key = target.closest("[data-key-tab]");
        const group = target.closest("[data-group-tab]");
        if (!sub && !key && !group) return;
        flushVisibleCard();
        flushGroups();
        if (sub) {
          const id = sub.getAttribute("data-sub-tab") || "";
          if (openKind === "sub" && subTab === id) openKind = "";
          else {
            openKind = "sub";
            subTab = id;
          }
        } else if (key) {
          const index = Number(key.getAttribute("data-key-tab"));
          if (openKind === "key" && keyTab === index) openKind = "";
          else {
            openKind = "key";
            keyTab = index;
          }
        } else if (group) {
          const id = group.getAttribute("data-group-tab") || "";
          if (openKind === "group" && openGroup === id) openKind = "";
          else {
            openKind = "group";
            openGroup = id;
          }
        }
        render();

      document.getElementById("preset-grid").addEventListener("click", (event) => {

      document.getElementById("add-provider-cancel").addEventListener("click", () => {
        document.getElementById("add-provider-dialog").close();
      });
      async function syncKeyless(id, btn) {
        if (btn) btn.disabled = true;
        flash("", t("settings.syncing"));
        const path = "/settings/models/opencode-free/sync";
        try {
          const res = await fetch(path, {
            method: "POST",
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            flash("error", body.error || t("settings.syncFailed"));
            return;
          }
          data = body;
          const probe = Array.isArray(body.probe) ? body.probe : [];
          const ok = probe.filter((row) => row.ok).length;
          const skip = probe.filter((row) => !row.ok);
          render();
          if (probe.length && !ok) {
            flash("error", t("settings.syncedNone"));
          } else if (skip.length) {
            flash(
              "ok",
              t("settings.syncedSkip", {
                ok: ok,
                names: skip.map((row) => row.id).join("、"),
              }),
            );
          } else {
            const n =
              ok ||
              (((data.picker || []).find((p) => p.id === id) || {}).models || [])
                .length;
            flash("ok", t("settings.synced", { n: n }));
          }
        } catch (err) {
          flash("error", err.message || t("settings.syncFailed"));
        } finally {
          if (btn) btn.disabled = false;
        }
      }
      async function deleteProvider(index) {
        const doomed = (data.providers || [])[index];
        if (!doomed || isKeylessProvider(doomed.id)) return;
        const name = doomed.name || doomed.id;
        data.providers.splice(index, 1);
        if (keyTab >= data.providers.length) keyTab = Math.max(0, data.providers.length - 1);
        const res = await fetch("/settings/models", {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ providers: snapshotProviders() }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          flash("error", body.error || t("deleteFailed"));
          await load();
          return;
        }
        data = body;
        render();
        flash("health", t("settings.deletedProvider", { name: name }));
      }

          ? (card.querySelector('[data-f="name"]')?.value ||
              card.querySelector('[data-f="id"]')?.value ||

      document.getElementById("providers").addEventListener("click", (event) => {

          flushVisibleCard();
          const [pi, mi] = el.closest("[data-del-model]").getAttribute("data-del-model").split(":").map(Number);
          if (isFree(((data.providers || [])[pi] || {}).id)) return;
          data.providers[pi].models.splice(mi, 1);
          render();
        }
      });
      async function saveGroups() {
        flushGroups();
        const res = await fetch("/settings/models", {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
          groups: Object.fromEntries(
            Object.entries(data.groups)
              .map(([id, group]) => [
                id,
                {
                  ...group,
                  members: (group.members || []).filter((member) => member.provider && member.model),
                },
              ])
              .filter(([, group]) => group.members.length),
          ),
        }),
        });
        const body = await res.json();
        if (!res.ok) {
          flash("error", body.error || "save failed");
          return;
        }
        data = body;
        render();
        flash("health", t("settings.groupsSaved"));
      }
      document.getElementById("add-group").addEventListener("click", () => {
        flushGroups();
        if (!data.groups) data.groups = {};
        const id = "g" + Date.now().toString(36);

        openGroup = id;
        render();
      });
      document.getElementById("groups").addEventListener("change", (event) => {
        const provider = event.target.closest('[data-g="provider"]');
        if (!provider) return;
        const row = provider.closest(".model-row");
        const model = row && row.querySelector('[data-g="model"]');
        if (model) model.innerHTML = memberModelOptions(provider.value, "");
      });
      document.getElementById("groups").addEventListener("click", (event) => {
        const el = event.target.closest ? event.target : event.target.parentElement;
        if (!el || !el.closest) return;
        if (el.closest("[data-save-groups]")) {
          saveGroups().catch((err) => flash("error", err.message));
          return;
        }
        const del = el.closest("[data-del-group]");
        if (del) {
          flushGroups();
          const id = del.getAttribute("data-del-group");
          delete data.groups[id];
          if (openGroup === id) openKind = "";
          render();
          return;
        }
        const add = el.closest("[data-add-member]");
        if (add) {
          flushGroups();
          const id = add.getAttribute("data-add-member");
          if (!data.groups[id]) return;
          data.groups[id].members.push({ provider: "", model: "" });
          render();
          return;
        }
        const drop = el.closest("[data-del-member]");
        if (drop) {
          flushGroups();
          const [id, index] = drop.getAttribute("data-del-member").split(":");
          if (data.groups[id]) data.groups[id].members.splice(Number(index), 1);
          render();
        }
      });
      window.addEventListener("guild-locale", render);
      load().catch((err) => flash("error", err.message));
