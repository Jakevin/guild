<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guild — 子代理</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/i18n.js"></script>
  </head>
  <body class="app library-page" data-i18n-page="subagents">
    <aside class="sidebar">
      <div class="side-brand"><a class="logo" href="/">Guild</a></div>
      <nav class="side-nav">
        <a href="/" data-i18n="nav.chat">訊息</a>
        <a href="/studio" data-i18n="nav.studio">酒吧</a>
        <a href="/library" data-i18n="nav.library">技能庫</a>
        <a class="on" href="/subagents" data-i18n="nav.subagents">子代理</a>
        <a href="/settings" data-i18n="nav.settings">模型</a>
      </nav>
      <div class="sidebar-resizer" data-i18n-title="sidebar.resize" title="拖曳調整寬度"></div>
    </aside>
    <section class="pane">
      <header class="pane-head">
        <h1 data-i18n="subagents.title">子代理庫</h1>
        <div class="meta" id="agent-summary"></div>
        <a class="btn" href="/subagents/add" data-i18n="subagents.install">新增子代理</a>
      </header>
      <div class="page-body">
        <p class="lede" data-i18n-html="subagents.lede">
          Guild 內建 explorer / worker / reviewer，加上本機 Codex、Grok、Claude 留下的 agent 檔。
          對話裡用 spawn 叫它們；自己建的走 <a href="/subagents/add">新增子代理</a>。
        </p>
        <p id="flash" class="muted"></p>
        <div class="toolbar">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="4.5" stroke="currentColor"/>
              <path d="M10.5 10.5 14 14" stroke="currentColor"/>
            </svg>
            <input id="agent-search" type="search" placeholder="搜尋子代理" data-i18n-placeholder="search.subagents" />
          </div>
        </div>
        <div id="tag-row" class="chips tag-row"></div>
        <div id="agent-grid" class="skill-grid"></div>
      </div>
    </section>
    <script>
      const flash = document.getElementById("flash");
      const COLORS = ["#7c6af7", "#5b8def", "#2ea887", "#e07a3d", "#d4537e", "#c9a227"];
      let allAgents = [];
      let openId = "";
      let activeTags = new Set();
      function tagPills(agent) {
        return (agent.tags || [])
          .map((tag) => {
            const on = activeTags.has(tag) ? " on" : "";
            return (
              '<span class="mini-tag' +
              on +
              '" data-tag="' +
              escapeHtml(tag) +
              '">' +
              escapeHtml(tagLabel(tag)) +
              "</span>"
            );
          })
          .join("");
      }
      function tagCounts() {
        const counts = new Map();
        for (const agent of allAgents) {
          for (const tag of agent.tags || []) {
            counts.set(tag, (counts.get(tag) || 0) + 1);
          }
        }
        return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      }
      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function hue(key) {
        let n = 0;
        for (const ch of key) n = (n + ch.charCodeAt(0) * 13) % COLORS.length;
        return COLORS[n];
      }
      function initials(name) {
        const parts = String(name).trim().split(/[\s-]+/);
        const letters = parts.map((p) => p[0]).join("").slice(0, 2);
        return letters.toUpperCase() || "?";
      }
      function cardHtml(agent) {
        const desc = agent.description || "";
        const source =
          agent.source === "host"
            ? agent.hostName || agent.host || t("library.local")
            : agent.source === "catalog"
              ? t("library.catalog")
              : t("library.user");
        const sourceTitle = agent.source === "host" && agent.path ? agent.path : "";
        const who =
          agent.source === "host"
            ? '<span class="muted">' + t("subagents.host") + "</span>"
            : '<span class="muted">' + t("subagents.spawnHint") + "</span>";
        const open = openId === agent.id;
        return (
          '<article class="lib-card' +
          (open ? " open" : "") +
          '" data-id="' +
          escapeHtml(agent.id) +
          '">' +
          '<div class="skill-ico" style="background:' +
          hue(agent.slug || agent.id) +
          '">' +
          initials(agent.name) +
          "</div>" +
          '<div class="skill-meta"><strong>' +
          escapeHtml(agent.name) +
          '</strong><em class="lib-desc">' +
          escapeHtml(desc) +
          "</em>" +
          (agent.tags && agent.tags.length
            ? '<p class="tag-list">' + tagPills(agent) + "</p>"
            : "") +
          '<p class="used-by">' +
          who +
          "</p>" +
          '<p class="hint"' +
          (sourceTitle ? ' title="' + escapeHtml(sourceTitle) + '"' : "") +
          ">" +
          escapeHtml(source) +
          "</p></div>" +
          (open
            ? '<pre class="lib-body">' + escapeHtml(agent.body || agent.instructions || "") + "</pre>"
            : "") +
          "</article>"
        );
      }
      function renderChips() {
        const allOn = activeTags.size === 0;
        document.getElementById("tag-row").innerHTML =
          '<button type="button" class="chip' +
          (allOn ? " on" : "") +
          '" data-tag="">' +
          t("library.all") +
          "</button>" +
          tagCounts()
            .map(([tag, n]) => {
              const on = activeTags.has(tag) ? " on" : "";
              return (
                '<button type="button" class="chip' +
                on +
                '" data-tag="' +
                escapeHtml(tag) +
                '">' +
                escapeHtml(tagLabel(tag)) +
                ' <span class="chip-n">' +
                n +
                "</span></button>"
              );
            })
            .join("");
      }
      function render() {
        renderChips();
        const q = document.getElementById("agent-search").value.toLowerCase();
        const pool = allAgents.filter((agent) => {
          const tags = agent.tags || [];
          const tagOk =
            activeTags.size === 0 || tags.some((tag) => activeTags.has(tag));
          const hay = (
            agent.name +
            " " +
            (agent.description || "") +
            " " +
            (agent.hostName || "") +
            " " +
            (agent.path || "") +
            " " +
            tags.map(tagLabel).join(" ") +
            " " +
            tags.join(" ")
          ).toLowerCase();
          return tagOk && (!q || hay.includes(q));
        });
        const filtering = Boolean(q) || activeTags.size > 0;
        document.getElementById("agent-summary").textContent = filtering
          ? t("library.found", { n: pool.length, total: allAgents.length })
          : t("subagents.count", { n: allAgents.length });
        const grid = document.getElementById("agent-grid");
        if (pool.length === 0) {
          grid.innerHTML =
            '<section class="empty">' + t("subagents.emptyHtml") + "</section>";
          return;
        }
        grid.innerHTML = pool.map(cardHtml).join("");
      }

      document.getElementById("agent-search").addEventListener("input", render);
      document.getElementById("tag-row").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-tag]");
        if (!chip) return;
        const tag = chip.getAttribute("data-tag");
        if (!tag || (activeTags.has(tag) && activeTags.size === 1)) {
          activeTags.clear();
        } else {
          activeTags = new Set(tag ? [tag] : []);
        }
        render();
      });
      document.getElementById("agent-grid").addEventListener("click", (event) => {
        const mini = event.target.closest(".mini-tag");
        if (mini) {
          const tag = mini.getAttribute("data-tag");
          activeTags = tag && activeTags.has(tag) && activeTags.size === 1
            ? new Set()
            : new Set(tag ? [tag] : []);
          render();
          return;
        }
        if (event.target.closest("a")) return;
        const card = event.target.closest(".lib-card");
        if (!card) return;
        const id = card.getAttribute("data-id");
        openId = openId === id ? "" : id;
        render();
      });

      Promise.all([
        fetch("/library/subagents").then((r) => r.json()),
        fetch("/library/subagents/host").then((r) => r.json()).catch(() => []),
      ])
        .then(([guild, host]) => {
          allAgents = (Array.isArray(guild) ? guild : []).concat(
            Array.isArray(host) ? host : [],
          );
          render();
        })
        .catch((err) => {
          flash.className = "error";
          flash.textContent = err.message;
        });
      window.addEventListener("guild-locale", render);
    </script>
  </body>
</html>
